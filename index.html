<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rocket landing</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>"
    />
  </head>
  <body>
    <main>
      <h1>Rocket landing</h1>
      <canvas id="scene" aria-label="The rocket above the landing pad"></canvas>
      <div class="controls">
        <button id="fly-yourself" type="button">Fly it yourself</button>
        <p id="fly-yourself-hint" class="hint">
          Space: start · Up: main engine · Left / Right: steer
        </p>
      </div>
      <section id="status-panel" class="status-panel" aria-label="Flight numbers"></section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
